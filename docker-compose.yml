services:
  db:
    image: postgres:16-alpine
    container_name: hiddencars-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiddencars
      POSTGRES_PASSWORD: hiddencars
      POSTGRES_DB: hiddencars
    ports:
      - "5432:5432"
    volumes:
      - hiddencars_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiddencars -d hiddencars"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hiddencars_pgdata:
